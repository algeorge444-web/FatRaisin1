name: Opening hours from OpenStreetMap
# Once a week, fills in opening hours from OpenStreetMap for places that have none yet (each run covers part of the map).
on:
  schedule:
    - cron: '23 12 * * 3'   # Wednesdays
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/osm-hours.mjs'
      - '.github/workflows/osm-hours.yml'
permissions:
  contents: write
concurrency:
  group: osm-hours
  cancel-in-progress: false
jobs:
  hours:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read opening hours from OpenStreetMap
        run: node tools/osm-hours.mjs --save "$RUNNER_TEMP/osm.json"
      - name: Match them to the newest copy of the places and save
        run: |
          git config user.name "FatRaisin hours search"
          git config user.email "actions@users.noreply.github.com"
          git pull -q origin main
          node tools/osm-hours.mjs --file "$RUNNER_TEMP/osm.json"
          git add place-media.js place-lists.js data-version.js tools/osm-hours-last-run.txt
          git diff --cached --quiet || git commit -m "Opening hours from OpenStreetMap: $(cat tools/.osm-hours-summary) added"
          git push
