name: Check candidate photos
# Runs when tools/photo-vet-list.json changes (or by hand). Downloads each candidate place photo and keeps only
# real photographs (not logos, text graphics or blank backgrounds). Saves tools/photo-vet-result.json. Changes no place data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/photo-vet-list.json'
      - 'tools/photo-vet.py'
permissions:
  contents: write
jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - run: python tools/photo-vet.py
      - name: Save the results
        run: |
          git config user.name "FatRaisin photo check"
          git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3; do
            cp tools/photo-vet-result.json "$RUNNER_TEMP/r.json"
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/r.json" tools/photo-vet-result.json
            git add tools/photo-vet-result.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Photo check results"
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
