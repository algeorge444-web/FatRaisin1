name: Look up map pins
# Runs when tools/geocode-list.json changes (or by hand). Looks up exact positions for places whose
# pin is approximate and saves tools/geocode-result.json. Changes no place data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/geocode-list.json'
      - 'tools/geocode.mjs'
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/geocode.mjs
      - name: Save the results
        run: |
          git config user.name "FatRaisin pin check"
          git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3; do
            cp tools/geocode-result.json "$RUNNER_TEMP/r.json"
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/r.json" tools/geocode-result.json
            git add tools/geocode-result.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Map pin lookup results"
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
