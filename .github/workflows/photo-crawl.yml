name: Find photos on places' websites
# Runs when tools/photo-list.json changes (or by hand). Looks for a photo on each listed place's own
# website and saves tools/photo-result.json. Changes no place data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/photo-list.json'
      - 'tools/photo-crawl.mjs'
permissions:
  contents: write
concurrency:
  group: photo-crawl
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open this job's share of the websites
        run: SHARD=${{ matrix.shard }} SHARDS=8 node tools/photo-crawl.mjs || echo "{}" > parts/p-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: photo-part-${{ matrix.shard }}
          path: parts/
  save:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Join the results and save them
        run: |
          node -e "
            const fs=require('fs'),path=require('path');const out={};
            const walk=d=>fs.readdirSync(d).forEach(f=>{const p=path.join(d,f);fs.statSync(p).isDirectory()?walk(p):Object.assign(out,JSON.parse(fs.readFileSync(p,'utf8')))});
            walk('parts');fs.writeFileSync('tools/photo-result.json',JSON.stringify(out));console.log(Object.keys(out).length,'saved');"
          git config user.name "FatRaisin photo search"
          git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3; do
            cp tools/photo-result.json "$RUNNER_TEMP/r.json"
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/r.json" tools/photo-result.json
            git add tools/photo-result.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Photo search results"
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
