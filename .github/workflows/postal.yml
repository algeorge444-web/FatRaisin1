name: Look up postal codes
# Runs when tools/postal-list.json changes (or by hand). Finds Canadian postal codes for addresses that have none
# (place websites + OpenStreetMap) and saves tools/postal-result.json. Changes no place data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/postal-list.json'
      - 'tools/postal-lookup.mjs'
permissions:
  contents: write
jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/postal-lookup.mjs
      - name: Save the results
        run: |
          git config user.name "FatRaisin postal check"
          git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3; do
            cp tools/postal-result.json "$RUNNER_TEMP/r.json"
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/r.json" tools/postal-result.json
            git add tools/postal-result.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Postal code lookup results"
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
