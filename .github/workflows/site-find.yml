name: Find new websites
# Runs when tools/site-find-list.json changes (or by hand). For places whose saved website is parked,
# for sale or gone, tries likely web addresses built from the name and saves tools/site-find-result.json.
# Changes no place data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/site-find-list.json'
      - 'tools/site-find.mjs'
permissions:
  contents: write
concurrency:
  group: site-find
  cancel-in-progress: true
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/site-find.mjs
      - name: Save the results
        run: |
          git config user.name "FatRaisin website check"
          git config user.email "actions@users.noreply.github.com"
          for try in 1 2 3; do
            cp tools/site-find-result.json "$RUNNER_TEMP/r.json"
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/r.json" tools/site-find-result.json
            git add tools/site-find-result.json
            git diff --cached --quiet && exit 0
            git commit -q -m "New website search results"
            git push -q origin HEAD:main && exit 0
            sleep 15
          done
          exit 1
